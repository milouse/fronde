image: ruby:3.4-alpine

default:
  before_script:
    - apk add -U build-base openssl-dev
    - bundle install -j $(nproc)

rubocop:
  stage: test
  script:
    - rubocop --fail-level W

rspec:
  stage: test
  variables:
    COVERAGE: cobertura
  script:
    - apk add -U emacs-nox ncurses
    - rspec
  coverage: '/Line Coverage: \d+\.\d+\%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/coverage.xml
